[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-visual-complexity"
version = "0.1.0"
description = "Quantifying visual complexity of medieval manuscript page layouts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gleb Schmidt" }, { name = "Daria Korop" }, { name = "Martin Roček" }, { name = "Jan Hajič jr." }, { name = "Lucie Doležalová" }]
requires-python = ">=3.12"
dependencies = [
    "docstring-parser>=0.16,<1",
    "httpx2[http2]>=2.16,<3",
    "jsonargparse>=4.35,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.8,<6",
    "pandas>=2.1.1,<4",
    "Pillow>=10.1,<14",
    "pyarrow>=14,<27",
    "PyYAML>=6.0.1,<7",
    "scikit-learn>=1.3.1,<2",
    "scipy>=1.11.2,<2",
    "shapely>=2.0.2,<3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
# Segmentation: Kraken for lines, ultralytics (AGPL-3.0) for YOLO's folios and regions.
segment = ["kraken>=7.1.1,<8", "torch>=2.9,<3", "ultralytics>=8.4.203,<9"]
# Vision transformers: their patch tokens (lvc embed) and the local ViT head's training.
vit = ["torch>=2.9,<3", "transformers>=4.56,<6"]

[project.urls]
Repository = "https://github.com/glsch/layout-visual-complexity"

[project.scripts]
lvc = "layout_visual_complexity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["layout_visual_complexity*"]

[tool.setuptools.package-data]
layout_visual_complexity = ["heads/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_models: needs the segmentation models in models/ and the segment extra, or the ViT backbone in the Hugging Face cache and the vit extra; skipped without them",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
