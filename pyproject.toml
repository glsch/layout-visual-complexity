[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-visual-complexity"
version = "0.1.0"
description = "Quantifying visual complexity of medieval manuscript page layouts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gleb Schmidt" }, { name = "Daria Korop" }, { name = "Martin Roček" }, { name = "Jan Hajič jr." }, { name = "Lucie Doležalová" }]
requires-python = ">=3.12"
dependencies = [
    "docstring-parser>=0.16,<1",
    "httpx2[http2]>=2.16,<3",
    "jsonargparse>=4.35,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1.1,<4",
    "PyYAML>=6.0.1,<7",
    "scikit-learn>=1.3.1,<2",
    "scipy>=1.11.2,<2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.urls]
Repository = "https://github.com/glsch/layout-visual-complexity"

[project.scripts]
lvc = "layout_visual_complexity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["layout_visual_complexity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
