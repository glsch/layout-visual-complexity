# The reference dataset: the 2026-06-29 export of the annotation app, without the exhibition sessions (their
# annotators were mostly not experts) and without the calibration judgments. Paths are relative to the working
# folder.
export: data/judgments/sessions_2026-06-29.json
mapping: data/dataset/selected_image_shelfmark_mapping.json
metadata: data/dataset/selected_manuscript_metadata_categorized.jsonl
merges: data/annotator_merges.tsv
output: build/dataset
exclude_calibration: true
exclude_sources: [exhibition-colophons]
canvases: true
notes:
  - "The categories were assigned automatically from the manuscripts' catalogue metadata by a language model, then
    checked by an expert; `category_confidence` is the model's own confidence in its category."
# Canvases checked by hand, for the pages whose folio label matched no canvas or several:
# canvas_overrides: data/canvas_overrides.tsv
