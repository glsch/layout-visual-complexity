# The difficulty experiment's held-out pages: CATMuS Medieval Segmentation's test split, its handwritten manuscripts of
# the 14th to the 16th century that aren't CREMMA's (BIS 193 and Laur. Plut. 39.34 are read from CREMMA, once): 59
# images of 15 manuscripts, with zones and lines but no transcriptions, so no text is recognised. The 31 double-page
# spreads, every image wider than tall, looked at one by one, are split into their pages first; a half without any
# ground-truth line is left out. Not part of `make all`: it needs the segment and vit extras, the models in models/,
# and the sources (make -C reproduce sources).
sources:
  - build/sources/catmus/data/test/metadata.jsonl
manuscripts:
  - paris-bnf-ita-783
  - paris-bnf-ita-481
  - paris-bnf-fr-574
  - paris-bnf-esp-65
  - paris-bnf-esp-36
  - paris-bnf-lat-14137
  - paris-bnf-nal-730
  - madrid-bne-mss-3995
  - paris-bnf-fr-604
  - paris-bnf-fr-413
  - paris-bnf-fr-2701
  - paris-bnf-lat-14650
  - paris-bnf-fr-1881
  - paris-bnf-esp-368
  - paris-bnf-smith-lesouef-16
output: build/difficulty/catmus_test
manuscript_table: reproduce/difficulty_manuscripts.tsv
regions:
  model: models/medieval-yolov11x.pt
recognition:
  model: models/catmus-medieval-1.6.0.mlmodel
spreads:
  pages:
    - madridbnemss3995_page-001-of-001
    - parisbnffr413_page-001-of-005
    - parisbnffr413_page-002-of-005
