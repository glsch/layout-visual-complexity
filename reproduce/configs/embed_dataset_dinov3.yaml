# The patch tokens of the dataset's pages from DINOv3 ViT-S/16, for the comparison of backbones (vit_backbones): its
# publisher's repository at its commit of 2025-08-19, its last block's tokens after the final layer norm, its four
# registers dropped, the folio crop resized to 592 pixels on the long edge (16-pixel patches, so the 37 patches of
# DINOv2's 518 pixels). The repository is gated: it needs access granted on Hugging Face and a token (HF_TOKEN in
# .env). Needs the vit extra.
layout: build/segment/dataset
output: build/embed/dataset_dinov3
tokens:
  backbone: facebook/dinov3-vits16-pretrain-lvd1689m
  revision: 114c1379950215c8b35dfcd4e90a5c251dde0d32
  layer: -1
  long_edge: 592
  crop: folio
