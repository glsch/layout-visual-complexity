output: build/score/crux
models: build/train/models_without_crux
# The rankers that come with the package, trained on every page of the dataset, score the same pages beside them
# (scores_all_dataset_pages.tsv), to measure what leaving Crux's manuscripts out changes.
other_models:
  all_dataset_pages: src/layout_visual_complexity/heads
inputs:
  label_filter: '\d+[a-z]*[rv]'
regions:
  model: models/medieval-yolov11x.pt
families: [colour]
maps: true
