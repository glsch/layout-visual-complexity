# Crux of Telč's 23 manuscripts, scored out of sample: their leaves (a number, perhaps a word such as `bis`, then
# recto or verso; flyleaves, covers and spines left out), each fetched at a 2,000-pixel long edge through
# Manuscriptorium's IIIF services, segmented as the dataset's pages are, and scored by the rankers trained without
# the four of Crux's manuscripts that gave the dataset pages (train_models_without_crux.yaml). The colour family
# describes the pages' colour (rubrics, coloured initials) for the case study's table; it doesn't enter the scores.
# Not part of `make all`: it needs the segment and vit extras, the models in models/ and the network, and three to four
# hours on an Apple M4 Pro.
sources:
  - https://collectiones.manuscriptorium.com/assorted/AIPDIG/NKCR__/1/AIPDIG-NKCR__I_E_32______15QUM41-cs/
  - https://collectiones.manuscriptorium.com/assorted/AIPDIG/NKCR__/1/AIPDIG-NKCR__I_G_40______19Y0SQ1-cs/
  - https://collectiones.manuscriptorium.com/assorted/AIPDIG/NKCR__/B/AIPDIG-NKCR__XIII_E_5____0OJC8HB-cs/
