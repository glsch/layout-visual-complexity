# The dataset's pages segmented: the folio crop (Otsu within YOLO's folio box), YOLO's regions and Kraken's lines, into
# a layout store in build/segment/dataset (layout/<manuscript>.parquet, pages.parquet, the report and the run's
# record). Needs the segment extra and the models in models/. Paths are relative to the working folder.
sources: [build/dataset/images.tsv]
output: build/segment/dataset
folio_box:
  model: models/folio_yolo.pt
regions:
  model: models/medieval-yolov11x.pt
