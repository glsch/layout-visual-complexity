outputs: [paired_differences]
evaluations:
  geometry: build/evaluate/geometry
  vit: build/evaluate/vit
  ensemble: build/evaluate/ensemble
labels:
  geometry: Geometry
  vit: ViT
  ensemble: Ensemble
comparisons:
  - [vit, geometry]
  - [ensemble, geometry]
  - [ensemble, vit]
